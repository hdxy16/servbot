version: '3.8'

services:

  bot:
    build: .
    container_name: my_finance_bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1


  gym-bot:
    build: .
    container_name: my_gym_bot
    restart: unless-stopped
    working_dir: /app/GYM_BOT
    command: python main.py
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1